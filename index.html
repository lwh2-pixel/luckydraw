<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>中秋晚會抽獎顯示（3位數版•雙頁面•大獎極大化•普獎60人完美版）</title>
<style>
  :root{
    --bg:#0b1020; --panel:#141a2f; --accent:#39d98a; --accent2:#6ea8fe;
    --danger:#ff5d6c; --warn:#ffb020; --text:#e6ebf5; --muted:#9aa5b1;
    --gold:#ffd166; --silver:#cdd7e1; --bronze:#d29b6f; --diamond:#7ae1ff; --supdiamond:#ff90e8;
  }
  html,body{height:100%;margin:0}
  body{
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    color:var(--text);display:flex;flex-direction:column;
    background:var(--page-bg, linear-gradient(180deg,#0b1020,#0a0f1e));
    background-size:cover;background-position:center;background-attachment:fixed;
    overflow: hidden; /* 防止整個頁面出現卷軸 */
  }
  header{
    display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;justify-content:space-between;
    padding:10px 16px;background:rgba(20,26,47,.86);backdrop-filter:saturate(120%) blur(6px);position:sticky;top:0;z-index:10;
    box-shadow:0 2px 14px rgba(0,0,0,.35);
  }
  .left, .right {display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
  select, button, input{
    background:#0f1530;color:var(--text);border:1px solid #273155;border-radius:8px;padding:.55rem .75rem;font-size:16px;
  }
  input[type="number"]{ width:5rem; text-align:center; }
  button.primary{background:linear-gradient(180deg,#1e2b6d,#152155);border-color:#2c3a7a;cursor:pointer;}
  button.danger{background:linear-gradient(180deg,#6d1e2a,#551521);border-color:#7a2c3a;cursor:pointer;}
  button.ghost{background:transparent;border-color:#33406c;cursor:pointer;}
  button:disabled{opacity:.6}
  .pill{padding:.35rem .6rem;border-radius:999px;border:1px solid #2b355f;background:#0e1430;color:#cfe3ff;font-size:.9rem}
  .status{font-variant-numeric:tabular-nums;letter-spacing:.3px}
  
  /* Tabs 樣式 */
  .tabs { display:flex; padding:16px 16px 0; gap:12px; }
  .tab-btn {
    flex:1; padding:14px; border-radius:12px 12px 0 0; 
    background:rgba(20,26,47,.55); border:1px solid #273155; border-bottom:none; 
    color:var(--muted); font-size:1.2rem; font-weight:bold; cursor:pointer; 
    transition:all .2s ease;
  }
  .tab-btn:hover { background:rgba(30,43,109,.4); color:#c7d3ea; }
  .tab-btn.active { 
    background:rgba(30,43,109,.85); color:#fff; 
    border-color:#3c509c; box-shadow:0 -4px 15px rgba(0,0,0,.3); 
  }

  .container{padding:12px 16px;display:flex;flex:1;min-height:0;flex-direction:column;}
  .page { display:none; gap:16px; flex:1; min-height:0; }
  .page.active { display:grid; }
  
  /* 分兩頁的 Grid 佈局 */
  #page1 { grid-template-columns: repeat(2, 1fr); }
  #page2 { grid-template-columns: repeat(3, 1fr); }
  @media (max-width:900px){ #page1, #page2 { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width:700px){ #page1, #page2 { grid-template-columns: 1fr; } header{position:static} }

  .board{
    background:rgba(20,26,47,.65);border:1px solid #273155;border-radius:14px;
    padding:16px;display:flex;flex-direction:column;min-height:120px;
  }
  .board-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,0.06)}
  .title{font-weight:700;letter-spacing:.5px;font-size:1.4rem;}
  .badge{font-size:1rem;padding:.2rem .6rem;border-radius:6px;border:1px solid #2b355f;background:#0e1430;color:#a9c1ff}
  
  /* ========================================= */
  /* 普獎區方塊樣式（專為 60 人設計的最佳化尺寸） */
  /* ========================================= */
  .grid{display:flex;flex-wrap:wrap;gap:12px;align-content:flex-start;overflow:auto;padding-bottom:6px;flex:1;}
  .cell{
    user-select:none;cursor:pointer;font-weight:800;font-variant-numeric:tabular-nums;
    display:inline-flex;align-items:center;justify-content:center;
    /* 預設 (15人以內) 尺寸很大 */
    min-width:105px;height:65px;border-radius:12px;padding:0 10px;
    border:1px solid #2a365f;background:linear-gradient(180deg,#11183a,#0c1330);
    box-shadow:0 4px 12px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.04);
    font-size:2.2rem;letter-spacing:1px;color:#eaf2ff;position:relative;transition:transform .05s ease, background .2s ease, border-color .2s ease;
  }
  
  /* 中度壓縮 (16 ~ 30人) */
  .grid.dense { gap: 10px; }
  .grid.dense .cell { min-width: 82px; height: 55px; font-size: 1.8rem; padding: 0 8px; border-radius: 10px; }
  
  /* 完美 60 人模式 (31 ~ 60+人) - 在 1920x1080 剛好塞滿整個版面且字體清晰 */
  .grid.fit60 { gap: 6px; }
  .grid.fit60 .cell { min-width: 65px; height: 44px; font-size: 1.45rem; padding: 0 4px; border-radius: 8px; letter-spacing: 0; }
  
  .cell:hover{transform:translateY(-2px)}
  .cell:active{transform:translateY(0)}
  .cell.marked{color:#fff;border-color:var(--danger);background:linear-gradient(180deg,#3a1120,#300c19)}
  .cell.marked::after{content:"已領";position:absolute;top:4px;right:6px;font-size:.7rem;color:#ffdfe3;opacity:.85;letter-spacing:0;}
  
  /* 已領標籤自動適配，不擋號碼 */
  .grid.dense .cell.marked::after { font-size: 0.65rem; top: 3px; right: 4px; }
  .grid.fit60 .cell.marked::after { font-size: 0.6rem; top: 2px; right: 4px; }

  .cell.new{animation:pop .6s ease}
  @keyframes pop{0%{transform:scale(0.4);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
  
  /* ========================================= */
  /* 大獎區專屬：極大化與填滿畫面樣式          */
  /* ========================================= */
  #page1 .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    grid-auto-rows: minmax(160px, 1fr);
    gap: 20px;
    flex: 1;
  }
  #page1 .cell {
    width: 100%; height: 100%; min-width: 0;
    font-size: clamp(4rem, 7vw, 10rem); 
    font-weight: 900; letter-spacing: 5px;
    border-radius: 24px; border-width: 2px;
    box-shadow: 0 8px 30px rgba(0,0,0,.5), inset 0 0 0 2px rgba(255,255,255,.08);
  }
  #page1 .cell.marked::after { font-size: 1.5rem; top: 14px; right: 20px; transform: scale(1); }
  /* ========================================= */

  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .muted{color:var(--muted)}
  .inputline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  #scanInput{min-width:250px; text-align:left;}
  .legend{display:flex;gap:8px;flex-wrap:wrap}
  .legend .swatch{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:4px}
  .legend .item{display:flex;align-items:center;gap:6px;color:#c7d3ea;font-size:.9rem}
  .toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#0d142e;border:1px solid #32406d;color:#eaf2ff;border-radius:10px;padding:.6rem .9rem;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:1000;display:none;font-size:1.1rem;}
  .bigflash{position:fixed;inset:0;background:radial-gradient(ellipse at center,rgba(255,255,255,.18),rgba(0,0,0,0) 70%);pointer-events:none;opacity:0;transition:opacity .35s ease}
  .bigflash.show{opacity:1}
  .hidden{display:none!important}
  
  .t-sup{color:var(--supdiamond)} .t-dia{color:var(--diamond)} .t-gold{color:var(--gold)} .t-silver{color:var(--silver)} .t-bronze{color:var(--bronze)}
  .quota{display:flex;gap:8px;align-items:center;flex-wrap:wrap; background:rgba(0,0,0,0.2); padding:4px 8px; border-radius:8px;}
  .quota input{width:4.5rem;text-align:center;padding:4px;}
  .cap-badge{font-size:.9rem;opacity:.9}
  .cap-reached{color:var(--warn)}

  /* 儀式感：大字展示 */
  .reveal-overlay{
    position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:3000;
    background:rgba(0,0,0,.72);backdrop-filter:blur(4px);
  }
  .reveal-overlay.show{display:flex;}
  .reveal-box{
    color:#fff; text-align:center; padding:24px 30px;
    border-radius:18px; border:1px solid rgba(255,255,255,.18);
    box-shadow:0 20px 80px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.06);
    background:radial-gradient(1200px 600px at 50% -10%, rgba(122,225,255,.18), rgba(255,255,255,0) 60%), rgba(7,10,26,.85);
    width:clamp(320px, 70vw, 820px);
    transform:scale(.9); opacity:0;
    animation:revealIn .35s cubic-bezier(.2,.9,.2,1) forwards;
  }
  .reveal-tier{font-size:1.5rem;letter-spacing:3px;opacity:.85;margin-bottom:8px}
  .reveal-code{
    font-weight:900; letter-spacing:8px;
    font-size:clamp(80px, 15vw, 180px);
    line-height:1.05; text-shadow:0 10px 40px rgba(0,0,0,.6);
  }
  @keyframes revealIn{
    0%{transform:scale(.9);opacity:0}
    100%{transform:scale(1);opacity:1}
  }

  .range-box{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .duration-box{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
</style>
</head>
<body>
<header>
  <div class="left">
    <strong>中秋抽獎顯示（極大化版）</strong>
    <span class="pill status" id="status">待命</span>
    <div class="legend">
      <span class="item"><span class="swatch" style="background:var(--supdiamond)"></span>超級鑽石</span>
      <span class="item"><span class="swatch" style="background:var(--diamond)"></span>鑽石</span>
      <span class="item"><span class="swatch" style="background:var(--gold)"></span>金</span>
      <span class="item"><span class="swatch" style="background:var(--silver)"></span>銀</span>
      <span class="item"><span class="swatch" style="background:var(--bronze)"></span>銅</span>
    </div>
  </div>
  <div class="right">
    <div class="row">
      <label class="muted">指定獎項</label>
      <select id="tier">
        <option value="sup">超級鑽石</option>
        <option value="dia">鑽石</option>
        <option value="gold">金</option>
        <option value="silver">銀</option>
        <option value="bronze">銅</option>
      </select>
      <span class="muted" style="font-size:0.85rem">快捷鍵 1–5</span>
    </div>
    <div class="row inputline">
      <input id="scanInput" autocomplete="off" placeholder="放游標於此，輸入3位數號碼" />
      <button id="btnDraw1" class="primary">抽1</button>
      <button id="btnDraw5" class="primary">抽5</button>
      <button id="btnDraw10" class="primary">抽10</button>
      <div class="range-box">
        <span class="muted">範圍</span>
        <input id="rangeMin" type="number" min="1" max="999" placeholder="1" />
        <span>–</span>
        <input id="rangeMax" type="number" min="1" max="999" placeholder="999" />
        <button id="btnSetRange" class="ghost">套用</button>
      </div>
      <div class="duration-box">
        <span class="muted">動畫(秒)</span>
        <input id="revealSec" type="number" min="0.3" max="10" step="0.1" />
      </div>
      <button id="btnExport" class="ghost">匯出CSV</button>
      <button id="btnClearTier" class="danger">清空當前 (C)</button>
      <button id="btnClearAll" class="danger">清空全部 (Alt+Shift+X)</button>
      <input id="bgFile" type="file" accept="image/*" class="hidden" />
      <button id="btnBg" class="ghost">背景圖片</button>
    </div>
    <div class="row quota">
      <span class="muted">名額：</span>
      <label>超鑽 <input id="cap-sup" type="number" min="0" step="1" value="3"></label>
      <label>鑽 <input id="cap-dia" type="number" min="0" step="1" value="10"></label>
      <label>金 <input id="cap-gold" type="number" min="0" step="1" value="20"></label>
      <label>銀 <input id="cap-silver" type="number" min="0" step="1" value="30"></label>
      <label>銅 <input id="cap-bronze" type="number" min="0" step="1" value="60"></label>
    </div>
  </div>
</header>

<!-- 分頁 Tab -->
<div class="tabs">
  <button id="tab1" class="tab-btn active" data-target="page1">大獎區 (超級鑽石 / 鑽石)</button>
  <button id="tab2" class="tab-btn" data-target="page2">普獎區 (金 / 銀 / 銅)</button>
</div>

<div class="container">
  
  <!-- 第一頁：超級鑽石、鑽石 -->
  <div id="page1" class="page active">
    <div class="board" data-tier="sup">
      <div class="board-header">
        <div class="title t-sup">超級鑽石獎</div>
        <div>
          <span class="badge" id="count-sup">0</span>
          <span class="badge cap-badge" id="capbadge-sup"></span>
        </div>
      </div>
      <div class="grid" id="grid-sup" aria-label="超級鑽石"></div>
    </div>

    <div class="board" data-tier="dia">
      <div class="board-header">
        <div class="title t-dia">鑽石獎</div>
        <div>
          <span class="badge" id="count-dia">0</span>
          <span class="badge cap-badge" id="capbadge-dia"></span>
        </div>
      </div>
      <div class="grid" id="grid-dia" aria-label="鑽石"></div>
    </div>
  </div>

  <!-- 第二頁：金、銀、銅 -->
  <div id="page2" class="page">
    <div class="board" data-tier="gold">
      <div class="board-header">
        <div class="title t-gold">金獎</div>
        <div>
          <span class="badge" id="count-gold">0</span>
          <span class="badge cap-badge" id="capbadge-gold"></span>
        </div>
      </div>
      <div class="grid" id="grid-gold" aria-label="金"></div>
    </div>

    <div class="board" data-tier="silver">
      <div class="board-header">
        <div class="title t-silver">銀獎</div>
        <div>
          <span class="badge" id="count-silver">0</span>
          <span class="badge cap-badge" id="capbadge-silver"></span>
        </div>
      </div>
      <div class="grid" id="grid-silver" aria-label="銀"></div>
    </div>

    <div class="board" data-tier="bronze">
      <div class="board-header">
        <div class="title t-bronze">銅獎</div>
        <div>
          <span class="badge" id="count-bronze">0</span>
          <span class="badge cap-badge" id="capbadge-bronze"></span>
        </div>
      </div>
      <div class="grid" id="grid-bronze" aria-label="銅"></div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>
<div class="bigflash" id="flash"></div>

<!-- 儀式感展示區 -->
<div id="reveal" class="reveal-overlay" aria-hidden="true">
  <div class="reveal-box">
    <div id="revealTier" class="reveal-tier">鑽石獎</div>
    <div id="revealCode" class="reveal-code">000</div>
  </div>
</div>

<script>
(function(){
  const state = {
    data: { sup:[], dia:[], gold:[], silver:[], bronze:[] },
    history: [],
    currentTier: 'sup',
    settings: { sound:true, animation:true, uniqueAcrossTiers:true },
    caps: { sup:3, dia:10, gold:20, silver:30, bronze:60 },
    bg: null,
    range: { min: 1, max: 999 },
    revealMs: 1200
  };

  const els = {
    tier: document.getElementById('tier'),
    input: document.getElementById('scanInput'),
    grids: {
      sup: document.getElementById('grid-sup'), dia: document.getElementById('grid-dia'), 
      gold: document.getElementById('grid-gold'), silver: document.getElementById('grid-silver'), 
      bronze: document.getElementById('grid-bronze')
    },
    counts: {
      sup: document.getElementById('count-sup'), dia: document.getElementById('count-dia'), 
      gold: document.getElementById('count-gold'), silver: document.getElementById('count-silver'), 
      bronze: document.getElementById('count-bronze')
    },
    capInputs: {
      sup: document.getElementById('cap-sup'), dia: document.getElementById('cap-dia'), 
      gold: document.getElementById('cap-gold'), silver: document.getElementById('cap-silver'), 
      bronze: document.getElementById('cap-bronze')
    },
    capBadges: {
      sup: document.getElementById('capbadge-sup'), dia: document.getElementById('capbadge-dia'), 
      gold: document.getElementById('capbadge-gold'), silver: document.getElementById('capbadge-silver'), 
      bronze: document.getElementById('capbadge-bronze')
    },
    toast: document.getElementById('toast'), flash: document.getElementById('flash'),
    btnExport: document.getElementById('btnExport'),
    btnClearTier: document.getElementById('btnClearTier'), btnClearAll: document.getElementById('btnClearAll'),
    btnBg: document.getElementById('btnBg'), bgFile: document.getElementById('bgFile'),
    btnDraw1: document.getElementById('btnDraw1'), btnDraw5: document.getElementById('btnDraw5'), btnDraw10: document.getElementById('btnDraw10'),
    status: document.getElementById('status'),
    reveal: document.getElementById('reveal'), revealTier: document.getElementById('revealTier'), revealCode: document.getElementById('revealCode'),
    rangeMin: document.getElementById('rangeMin'), rangeMax: document.getElementById('rangeMax'), btnSetRange: document.getElementById('btnSetRange'),
    revealSec: document.getElementById('revealSec'),
    tabs: document.querySelectorAll('.tab-btn'),
    pages: document.querySelectorAll('.page')
  };

  // 初始化
  loadFromStorage();
  syncCapInputs();
  syncRangeInputs();
  syncRevealInput();
  applyBackground();
  renderAll();
  switchPageByTier(state.currentTier);
  focusInput();
  updateStatus('待命');

  // 切換分頁邏輯
  els.tabs.forEach(tab => {
    tab.addEventListener('click', (e) => {
      const target = e.target.dataset.target;
      switchPageUI(target);
      // 同步預設獎項
      if(target === 'page1' && !['sup','dia'].includes(state.currentTier)) setTier('dia');
      if(target === 'page2' && !['gold','silver','bronze'].includes(state.currentTier)) setTier('gold');
    });
  });

  function switchPageUI(pageId) {
    els.tabs.forEach(t => t.classList.toggle('active', t.dataset.target === pageId));
    els.pages.forEach(p => p.classList.toggle('active', p.id === pageId));
  }

  function switchPageByTier(tier) {
    if(['sup', 'dia'].includes(tier)) switchPageUI('page1');
    else switchPageUI('page2');
  }

  // 名額上限變更
  Object.entries(els.capInputs).forEach(([tier, inputEl])=>{
    inputEl.addEventListener('change', ()=>{
      const v = Math.max(0, parseInt(inputEl.value||'0', 10) || 0);
      state.caps[tier] = v;
      inputEl.value = String(v);
      saveToStorage();
      updateCounts();
    });
  });

  // 範圍設定
  els.btnSetRange.addEventListener('click', ()=>{
    let min = toInt(els.rangeMin.value, 1);
    let max = toInt(els.rangeMax.value, 999);
    if(min < 1) min = 1;
    if(max > 999) max = 999;
    if(min > max){ const t=min; min=max; max=t; }
    state.range.min = min;
    state.range.max = max;
    saveToStorage();
    syncRangeInputs();
    showToast(`範圍更新：${pad3(min)}–${pad3(max)}`);
  });

  function syncRangeInputs(){
    els.rangeMin.value = state.range.min;
    els.rangeMax.value = state.range.max;
  }

  // 展示時間設定
  els.revealSec.addEventListener('change', ()=>{
    let sec = parseFloat(String(els.revealSec.value||'').trim());
    if(!Number.isFinite(sec)) sec = 1.2;
    sec = Math.max(0.3, Math.min(10, sec));
    state.revealMs = Math.round(sec * 1000);
    els.revealSec.value = (state.revealMs/1000).toFixed(1);
    saveToStorage();
  });
  function syncRevealInput(){
    els.revealSec.value = (state.revealMs/1000).toFixed(1);
  }

  // 切換獎項
  els.tier.addEventListener('change', e=>{
    const t = e.target.value;
    state.currentTier = t;
    switchPageByTier(t);
    focusInput();
    showToast('已切換獎項：' + tierName(t));
  });

  // 背景圖片
  els.btnBg.addEventListener('click', ()=> els.bgFile.click());
  els.bgFile.addEventListener('change', async (e)=>{
    const file = e.target.files?.[0];
    if(!file) return;
    const dataUrl = await fileToDataURL(file);
    state.bg = await downscaleImage(dataUrl, 3000);
    saveToStorage(); applyBackground(); showToast('背景已更新');
    e.target.value = '';
  });

  // 一鍵抽獎
  let drawing = false;
  els.btnDraw1.addEventListener('click', ()=> startDraw(1));
  els.btnDraw5.addEventListener('click', ()=> startDraw(5));
  els.btnDraw10.addEventListener('click', ()=> startDraw(10));

  async function startDraw(count){
    if(drawing) return;
    const tier = state.currentTier;
    const cap = state.caps[tier] || 0;
    const current = state.data[tier].length;

    const room = cap>0 ? Math.max(0, cap - current) : count;
    if(cap>0 && room<=0){
      showToast(`${tierName(tier)} 名額已滿（上限 ${cap}）`);
      warnCap(tier); return;
    }

    const used = new Set();
    for(const list of Object.values(state.data)){ for(const it of list){ used.add(it.code); } }

    const candidates = [];
    for(let n=state.range.min; n<=state.range.max; n++){
      const code = pad3(n);
      if(state.settings.uniqueAcrossTiers){
        if(!used.has(code)) candidates.push(code);
      }else{
        if(!state.data[tier].some(x=>x.code===code)) candidates.push(code);
      }
    }

    if(candidates.length===0){
      showToast('範圍內沒有可抽的號碼（已全抽完）'); return;
    }

    const canDraw = Math.min(count, room, candidates.length);

    drawing = true;
    els.btnDraw1.disabled = els.btnDraw5.disabled = els.btnDraw10.disabled = true;
    shuffleInPlace(candidates);

    try{
      for(let i=0;i<canDraw;i++){
        const code = candidates[i];
        await revealOnce(tier, code);
        addNumberToTier(tier, code);
        await wait(150);
      }
    } finally {
      drawing = false;
      els.btnDraw1.disabled = els.btnDraw5.disabled = els.btnDraw10.disabled = false;
    }
  }

  function shuffleInPlace(arr){
    for(let i=arr.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]] = [arr[j],arr[i]];
    }
  }

  async function revealOnce(tier, code){
    els.revealTier.textContent = tierName(tier);
    els.revealCode.textContent = code;
    els.reveal.classList.add('show');
    playRevealSound();
    await wait(state.revealMs);
    els.reveal.classList.remove('show');
  }

  function addNumberToTier(tier, code){
    const cap = state.caps[tier] || 0;
    if(cap>0 && state.data[tier].length >= cap){
      showToast(`${tierName(tier)} 名額已滿`); warnCap(tier); return;
    }
    if(state.settings.uniqueAcrossTiers && existsAnywhere(code)){ showToast(`號碼 ${code} 已在其他獎項出現`); return; }
    if(state.data[tier].some(x=>x.code===code)){ showToast(`此獎項已包含 ${code}`); blinkCell(tier, code); return; }

    const item = {code, marked:false, ts:Date.now()};
    state.data[tier].push(item);
    state.history.push({op:'add', tier, code});
    saveToStorage();
    addCellToGrid(tier, item, true);
    updateCounts();
    flash(); playSound();
    updateStatus(`已加入 ${tierName(tier)}：${code}`);
  }

  // 鍵盤快捷鍵
  document.addEventListener('keydown', e=>{
    const isTyping = document.activeElement === els.input || document.activeElement === els.rangeMin || document.activeElement === els.rangeMax || document.activeElement === els.revealSec;
    if(!isTyping && !e.ctrlKey && !e.metaKey && !e.shiftKey){
      if(e.key==='1') setTier('sup');
      if(e.key==='2') setTier('dia');
      if(e.key==='3') setTier('gold');
      if(e.key==='4') setTier('silver');
      if(e.key==='5') setTier('bronze');
    }
    if(e.key==='Backspace'){ e.preventDefault(); undoLast(); }
    if(e.key===' '){ e.preventDefault(); flash(); playSound(); }
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase()==='s'){ e.preventDefault(); exportCSV(); }
    if(!e.ctrlKey && !e.metaKey && (e.key.toLowerCase()==='c')){ if(!isTyping) clearCurrentTier(); }
    if(e.altKey && e.shiftKey && e.key.toLowerCase()==='x'){ e.preventDefault(); clearAll(); }
    if(e.key==='Delete'){
      const focusCell = document.activeElement?.classList?.contains('cell') ? document.activeElement : null;
      if(focusCell) removeCode(focusCell.dataset.tier, focusCell.dataset.code);
    }
  });

  els.input.addEventListener('keydown', e=>{
    if(e.key==='Enter'){
      const raw = els.input.value.trim();
      handleCode(raw);
      els.input.value = '';
    }
  });

  els.btnExport.addEventListener('click', exportCSV);
  els.btnClearTier.addEventListener('click', clearCurrentTier);
  els.btnClearAll.addEventListener('click', clearAll);

  let pressTimer=null;
  function attachCellEvents(el){
    el.addEventListener('click', ()=>{ toggleMark(el.dataset.tier, el.dataset.code); el.focus(); });
    el.addEventListener('keydown', (e)=>{
      if(e.key==='Enter' || e.key===' '){ e.preventDefault(); toggleMark(el.dataset.tier, el.dataset.code); }
    });
    el.addEventListener('mousedown', ()=>{
      clearTimeout(pressTimer);
      pressTimer = setTimeout(()=>{ removeCode(el.dataset.tier, el.dataset.code); }, 950);
    });
    ['mouseup','mouseleave'].forEach(evt=>el.addEventListener(evt, ()=>clearTimeout(pressTimer)));
  }

  function handleCode(raw){
    if(!raw) return;
    const code = normalizeCode(raw);
    if(!/^[0-9]{3}$/.test(code)){ showToast('請輸入3位數字'); return; }
    addNumberToTier(state.currentTier, code);
  }

  function warnCap(tier){
    const badge = els.capBadges[tier];
    if(!badge) return;
    badge.classList.add('cap-reached');
    setTimeout(()=>badge.classList.remove('cap-reached'), 1200);
  }

  function normalizeCode(s){
    s = String(s||'').replace(/\s+/g,'').replace(/[^\d]/g,'');
    if(s.length===3) return s;
    if(s.length>3) return s.slice(-3);
    return s.padStart(3,'0');
  }
  const pad3 = n => String(Math.max(0, Math.min(999, n|0))).padStart(3,'0');
  const toInt = (v, def=0)=> { const n = parseInt(String(v||'').trim(), 10); return Number.isFinite(n) ? n : def; }
  function tierName(t){ return {sup:'超級鑽石', dia:'鑽石', gold:'金', silver:'銀', bronze:'銅'}[t] || t; }

  function addCellToGrid(tier, item, isNew=false){
    const grid = els.grids[tier];
    const el = document.createElement('button');
    el.type='button';
    el.className='cell' + (isNew?' new':'') + (item.marked?' marked':'');
    el.textContent=item.code;
    el.dataset.code=item.code;
    el.dataset.tier=tier;
    el.setAttribute('tabindex','0');
    attachCellEvents(el);
    grid.appendChild(el);
    grid.scrollTop = grid.scrollHeight;
  }

  function blinkCell(tier, code){
    const el = els.grids[tier].querySelector(`.cell[data-code="${code}"]`);
    if(el){ el.style.outline='2px solid var(--warn)'; setTimeout(()=>el.style.outline='none', 600); }
  }

  function toggleMark(tier, code){
    const it = state.data[tier].find(x=>x.code===code);
    if(!it) return;
    it.marked = !it.marked;
    state.history.push({op:'mark', tier, code});
    saveToStorage();
    const el = els.grids[tier].querySelector(`.cell[data-code="${code}"]`);
    if(el) el.classList.toggle('marked', it.marked);
  }

  function removeCode(tier, code){
    const arr = state.data[tier];
    const idx = arr.findIndex(x=>x.code===code);
    if(idx<0) return;
    arr.splice(idx,1);
    state.history.push({op:'remove', tier, code});
    saveToStorage();
    const el = els.grids[tier].querySelector(`.cell[data-code="${code}"]`);
    if(el) el.remove();
    updateCounts();
  }

  function existsAnywhere(code){ return Object.values(state.data).some(list=>list.some(x=>x.code===code)); }

  function renderAll(){
    for(const t of Object.keys(state.data)){
      els.grids[t].innerHTML='';
      state.data[t].forEach(item=>addCellToGrid(t,item,false));
    }
    updateCounts();
    els.tier.value = state.currentTier;
  }

  // 簡化為 2 階段尺寸判定，為 60 人提供完美最佳化
  function updateCounts(){
    for(const t of Object.keys(state.data)){
      els.counts[t].textContent = state.data[t].length;
      const cap = state.caps[t] || 0;
      els.capBadges[t].textContent = cap>0 ? `上限 ${cap}` : '不限';
      els.capBadges[t].classList.toggle('cap-reached', cap>0 && state.data[t].length >= cap);
      
      const n = state.data[t].length, g = els.grids[t];
      g.classList.remove('dense', 'fit60');
      
      if(n >= 31) g.classList.add('fit60'); // 31~60人，方塊 65x44
      else if(n >= 16) g.classList.add('dense'); // 16~30人，方塊 82x55
    }
  }

  function undoLast(){
    const last = state.history.pop();
    if(!last) return showToast('無可撤回的操作');
    if(last.op==='add'){ removeCode(last.tier, last.code); state.history.pop(); }
    else if(last.op==='remove'){
      const rec = {code:last.code, marked:false, ts:Date.now()};
      state.data[last.tier].push(rec); saveToStorage(); addCellToGrid(last.tier, rec, false); updateCounts();
    }
    else if(last.op==='mark'){ toggleMark(last.tier, last.code); state.history.pop(); }
  }

  function saveToStorage(){
    localStorage.setItem('luckydraw-v6', JSON.stringify({
      data:state.data, currentTier:state.currentTier, caps:state.caps, bg:state.bg, range:state.range, revealMs:state.revealMs
    }));
  }
  
  function loadFromStorage(){
    try{
      const raw = localStorage.getItem('luckydraw-v6') || localStorage.getItem('luckydraw-v5');
      if(!raw) return;
      const obj = JSON.parse(raw);
      if(obj && obj.data){
        state.data = obj.data;
        state.currentTier = obj.currentTier || 'sup';
        if(obj.caps) state.caps = Object.assign(state.caps, obj.caps);
        if(obj.bg) state.bg = obj.bg;
        if(obj.range){ state.range.min = toInt(obj.range.min, 1); state.range.max = toInt(obj.range.max, 999); }
        if(obj.revealMs) state.revealMs = Math.max(300, Math.min(10000, obj.revealMs|0));
      }
    }catch(e){}
  }
  
  function syncCapInputs(){ for(const t of Object.keys(state.caps)) els.capInputs[t].value = state.caps[t]; }
  function applyBackground(){ document.body.style.setProperty('--page-bg', state.bg ? `url("${state.bg}")` : 'linear-gradient(180deg,#0b1020,#0a0f1e)'); }
  function focusInput(){ setTimeout(()=>{ els.input.focus(); els.input.select(); }, 50); }
  function showToast(msg){
    els.toast.textContent = msg; els.toast.style.display='block';
    clearTimeout(showToast.t); showToast.t = setTimeout(()=>els.toast.style.display='none', 1800);
  }
  function flash(){
    els.flash.classList.add('show'); setTimeout(()=>els.flash.classList.remove('show'), 280);
  }
  function playSound(){
    try{
      const ctx = new (window.AudioContext||window.webkitAudioContext)();
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type='triangle'; o.frequency.value=660; g.gain.value=0.001;
      o.connect(g).connect(ctx.destination);
      g.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime+0.01);
      o.start(); o.frequency.exponentialRampToValueAtTime(990, ctx.currentTime+0.08);
      g.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime+0.25); o.stop(ctx.currentTime+0.26);
    }catch(e){}
  }
  function playRevealSound(){
    try{
      const ctx = new (window.AudioContext||window.webkitAudioContext)();
      const g = ctx.createGain(); g.connect(ctx.destination); g.gain.value=0.001;
      const o1 = ctx.createOscillator(); o1.type='sawtooth'; o1.frequency.value=220; o1.connect(g);
      const o2 = ctx.createOscillator(); o2.type='square'; o2.frequency.value=440; o2.connect(g);
      g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime+0.02);
      o1.start(); o2.start(); o2.frequency.exponentialRampToValueAtTime(660, ctx.currentTime+0.4);
      g.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime+0.6); o1.stop(ctx.currentTime+0.62); o2.stop(ctx.currentTime+0.62);
    }catch(e){}
  }

  // 匯出分3欄格式
  function exportCSV(){
    const rows = [];
    const BOM = '\uFEFF';
    
    for(const [tier, list] of Object.entries(state.data)){
      if(list.length === 0) continue;
      rows.push([`${tierName(tier)} 中獎名單`, '', '']);
      for(let i=0; i<list.length; i+=3){
        const row = [];
        for(let j=0; j<3; j++){
          const item = list[i+j];
          if(item) {
            row.push(item.code + (item.marked ? ' (已領)' : ''));
          } else {
            row.push('');
          }
        }
        rows.push(row);
      }
      rows.push(['','','']); 
    }
    
    if(rows.length === 0) rows.push(['目前無中獎紀錄', '', '']);

    const csv = rows.map(r=>r.map(s=>`"${String(s).replace(/"/g,'""')}"`).join(',')).join('\r\n');
    const blob = new Blob([BOM, csv], { type: 'text/csv;charset=utf-8;' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '中秋晚會_抽獎名單.csv';
    a.click();
  }

  function clearCurrentTier(){
    const t = state.currentTier;
    if(!confirm(`確定清空「${tierName(t)}」所有號碼嗎？`)) return;
    state.data[t] = []; saveToStorage(); renderAll(); showToast(`已清空 ${tierName(t)}`);
  }
  function clearAll(){
    if(!confirm('確定清空全部中獎名單？此動作無法復原。')) return;
    for(const t of Object.keys(state.data)) state.data[t] = [];
    state.history = []; saveToStorage(); renderAll(); showToast('已清空全部名單');
  }

  function setTier(t){ 
    state.currentTier = t; els.tier.value = t; 
    switchPageByTier(t); focusInput(); showToast('已切換：' + tierName(t)); 
  }
  function updateStatus(msg){ els.status.textContent = msg; }
  
  function fileToDataURL(file){
    return new Promise((res,rej)=>{
      const r = new FileReader(); r.onload = ()=>res(r.result); r.onerror = rej; r.readAsDataURL(file);
    });
  }
  function downscaleImage(dataUrl, maxW){
    return new Promise((resolve)=>{
      const img = new Image();
      img.onload = ()=>{
        const scale = Math.min(1, maxW / Math.max(img.width, img.height));
        if(scale >= 1) return resolve(dataUrl);
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale); canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.92));
      };
      img.src = dataUrl;
    });
  }
  const wait = ms => new Promise(res=> setTimeout(res, ms));

})();
</script>
</body>
